# Ship Windows executables without requiring the Visual C++ Redistributable.
[target.x86_64-pc-windows-msvc]
# Control Flow Guard hardens indirect calls in shipped Windows builds.
rustflags = ["-C", "target-feature=+crt-static", "-C", "control-flow-guard"]

[alias]
xtask = "run --locked --manifest-path tools/Cargo.toml --"
