[package]
name = "reclaim-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
reclaim = { path = ".." }

[[bin]]
name = "scan"
path = "fuzz_targets/scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source"
path = "fuzz_targets/source.rs"
test = false
doc = false
bench = false

[[bin]]
name = "allocation"
path = "fuzz_targets/allocation.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[profile.release]
debug = 0
