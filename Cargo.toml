[package]
name = "reclaim"
version = "0.2.4"
edition = "2024"
license = "MIT"
description = "Read-only disk image carving and file recovery"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "accessibility"] }
log = "=0.4.34"
# One error type for app-level failures (updater, installer, processes); parsers keep io::Result.
anyhow = { version = "=1.0.104", default-features = false, features = ["std"] }
rfd = "=0.17.2"
serde_json = "=1.0.151"
image = { version = "=0.25.10", default-features = false, features = ["ico", "png", "bmp", "jpeg", "gif", "webp"] }
crc32fast = "=1.5.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
quick-xml = { version = "=0.41.0", default-features = false }
pulldown-cmark = { version = "=0.13.6", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
sys-locale = "=0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"
zbus = "=5.19.0"
# Load X11 at runtime, as Wayland already is, so building needs only the
# fontconfig headers (Slint's text layout links fontconfig directly).
tiny-xlib = { version = "=0.2.5", default-features = false, features = ["dlopen"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Ioctl", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "=0.8.7"
libc = "=0.2.191"

# Keep the updater synchronous on a worker thread, without an async runtime.
[dependencies.ureq]
version = "=3.4.2"
default-features = false
features = ["rustls"]

[dependencies.semver]
version = "=1.0.28"

[dependencies.sha2]
version = "=0.10.9"

# Ed25519 (Minisign) update signatures; no transitive dependencies.
[dependencies.minisign-verify]
version = "=0.3.0"

[dependencies.tempfile]
version = "=3.27.0"

# Compiler-enforced half of the project audit (tests/audit checks these stay on).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Peak tier: compiler lints that catch dead, unclear or misused code.
unused_must_use = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
let_underscore_drop = "deny"
elided_lifetimes_in_paths = "deny"
meta_variable_misuse = "deny"
non_ascii_idents = "deny"
redundant_lifetimes = "deny"
unit_bindings = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
# Peak tier: whole Clippy groups. A lint here is a likely bug, not taste.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Pedantic lints that are taste, not bugs: opted out on purpose.
must_use_candidate = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
# Panics on malformed input are a denial of service (CWE-248).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
string_slice = "deny"
# Every unsafe block explains why it is sound (CWE-119).
undocumented_unsafe_blocks = "deny"
# Leftover debug code and silenced warnings (CWE-489, CWE-1164).
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Resource handling (CWE-401, CWE-770).
mem_forget = "deny"
large_stack_arrays = "deny"
# Lossy casts on sizes and offsets read from scanned data (CWE-190, CWE-681).
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# Panics hidden behind a Result signature, and ignored failures (CWE-252, CWE-248).
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
fallible_impl_from = "deny"
get_unwrap = "deny"
exit = "deny"
let_underscore_must_use = "deny"
# Peak tier, bug-catching picks from nursery and restriction.
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
map_err_ignore = "deny"
let_underscore_untyped = "deny"
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "deny"
collection_is_never_read = "deny"
read_zero_byte_vec = "deny"
literal_string_with_formatting_args = "deny"
debug_assert_with_mut_call = "deny"
path_buf_push_overwrite = "deny"
suspicious_operation_groupings = "deny"
iter_over_hash_type = "deny"
mixed_read_write_in_expression = "deny"
lossy_float_literal = "deny"
float_cmp_const = "deny"
rc_mutex = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
clone_on_ref_ptr = "deny"
try_err = "deny"
verbose_file_reads = "deny"
filetype_is_file = "deny"
fn_to_numeric_cast_any = "deny"
same_name_method = "deny"
rest_pat_in_fully_bound_structs = "deny"
assertions_on_result_states = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
infinite_loop = "deny"
error_impl_error = "deny"
string_lit_chars_any = "deny"
suspicious_xor_used_as_pow = "deny"
redundant_clone = "deny"
needless_collect = "deny"
or_fun_call = "deny"
useless_let_if_seq = "deny"
equatable_if_let = "deny"
branches_sharing_code = "deny"
set_contains_or_insert = "deny"
while_float = "deny"
unused_peekable = "deny"
non_send_fields_in_send_ty = "deny"
trait_duplication_in_bounds = "deny"
type_repetition_in_bounds = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
# A wrap that slips past checked arithmetic aborts instead of producing a
# wrong length or offset (CWE-190).
overflow-checks = true

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
# Project audit (tests/audit): parse the source and configuration.
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
serde = "=1.0.229"
syn = { version = "=2.0.119", features = ["full", "visit"] }
toml = "=1.2.1"
