[package]
name = "reclaim"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "Read-only disk image carving and file recovery"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "accessibility"] }
log = "=0.4.34"
rfd = "=0.17.2"
serde_json = "=1.0.151"
image = { version = "=0.25.10", default-features = false, features = ["ico", "png", "bmp", "jpeg", "gif", "webp"] }
crc32fast = "=1.5.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
quick-xml = { version = "=0.41.0", default-features = false }
pulldown-cmark = { version = "=0.13.6", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
sys-locale = "=0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"
zbus = "=5.19.0"
# Load X11 at runtime, as Wayland already is, so building needs only the
# fontconfig headers (Slint's text layout links fontconfig directly).
tiny-xlib = { version = "=0.2.5", default-features = false, features = ["dlopen"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Ioctl", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "=0.8.7"
libc = "=0.2.191"

# Keep the updater synchronous on a worker thread, without an async runtime.
[dependencies.ureq]
version = "=3.4.2"
default-features = false
features = ["rustls"]

[dependencies.semver]
version = "=1.0.28"

[dependencies.sha2]
version = "=0.10.9"

# Ed25519 (Minisign) update signatures; no transitive dependencies.
[dependencies.minisign-verify]
version = "=0.3.0"

[dependencies.tempfile]
version = "=3.27.0"

# Compiler-enforced half of the project audit (tests/audit checks these stay on).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# Panics on malformed input are a denial of service (CWE-248).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
string_slice = "deny"
# Every unsafe block explains why it is sound (CWE-119).
undocumented_unsafe_blocks = "deny"
# Leftover debug code and silenced warnings (CWE-489, CWE-1164).
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Resource handling (CWE-401, CWE-770).
mem_forget = "deny"
large_stack_arrays = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
# Project audit (tests/audit): parse the source and configuration.
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
serde = "=1.0.229"
syn = { version = "=2.0.119", features = ["full", "visit"] }
toml = "=1.2.1"
