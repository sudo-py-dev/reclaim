name: Windows test build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: |
            .
            tools
      - name: Build the native Windows executable
        run: cargo build --locked --release --bin reclaim
      - name: Package portable executable and licenses
        run: |
          cargo xtask bundle target/release/reclaim.exe dist/windows-preview reclaim-windows-x86_64-fixed.exe
          cargo xtask checksums dist/windows-preview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reclaim-windows-test-build
          path: dist/windows-preview/*
          if-no-files-found: error
          retention-days: 14
