name: Desktop checks
# Pull requests are checked once via `pull_request`; `push` covers main only,
# so a push to a PR branch no longer runs the whole matrix twice.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  workflow_call:
# A newer push to a PR cancels the run it replaces. Every commit on main gets its
# own group so it is always checked in full; one merge never cancels another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: |
            .
            tools
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        # Only fontconfig headers are needed: X11, Wayland and xkbcommon load at
        # runtime. Skipping apt when they are present avoids flaky package mirrors.
        run: |
          if pkg-config --exists fontconfig; then
            echo "fontconfig headers already installed"
          else
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libfontconfig-dev
          fi
      - run: cargo fmt --all -- --check
        if: runner.os == 'Linux'
      - run: cargo fmt --manifest-path tools/Cargo.toml -- --check
        if: runner.os == 'Linux'
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tools/Cargo.toml
      - run: cargo clippy --locked --manifest-path tools/Cargo.toml --all-targets -- -D warnings
  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Known vulnerabilities (RustSec), yanked crates, bans and sources.
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check advisories bans sources
      - name: Tooling dependencies
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          manifest-path: tools/Cargo.toml
          arguments: --config tools/deny.toml
          command: check advisories bans sources
  website:
    name: Website checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
