name: Desktop builds
# Pull requests are checked once via `pull_request`; `push` covers main only,
# so a push to a PR branch no longer runs the whole matrix twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A newer push to a PR cancels the run it replaces. Every commit on main gets its
# own group so it is always checked in full; one merge never cancels another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        # Only fontconfig headers are needed: X11, Wayland and xkbcommon load at
        # runtime. Skipping apt when they are present avoids flaky package mirrors.
        run: |
          if pkg-config --exists fontconfig; then
            echo "fontconfig headers already installed"
          else
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libfontconfig-dev
          fi
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/Reclaim.app/Contents/MacOS
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          lipo -create target/aarch64-apple-darwin/release/reclaim target/x86_64-apple-darwin/release/reclaim -output dist/Reclaim.app/Contents/MacOS/reclaim
          cp packaging/macos/Info.plist dist/Reclaim.app/Contents/
          mkdir -p dist/Reclaim.app/Contents/Resources
          cp assets/icons/reclaim.icns dist/Reclaim.app/Contents/Resources/
          cp assets/fonts/DejaVu-LICENSE.txt dist/Reclaim.app/Contents/Resources/
          codesign --force --sign - dist/Reclaim.app
          ditto -c -k --keepParent dist/Reclaim.app dist/Reclaim-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: reclaim-${{ runner.os }}
          path: |
            target/release/reclaim
            target/release/reclaim.exe
            dist/Reclaim-macOS.zip
            README.md
            LICENSE
            assets/fonts/DejaVu-LICENSE.txt
  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Known vulnerabilities (RustSec), yanked crates, bans and sources.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
