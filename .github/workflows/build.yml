name: Desktop builds
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/Reclaim.app/Contents/MacOS
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          lipo -create target/aarch64-apple-darwin/release/reclaim target/x86_64-apple-darwin/release/reclaim -output dist/Reclaim.app/Contents/MacOS/reclaim
          cp packaging/macos/Info.plist dist/Reclaim.app/Contents/
          mkdir -p dist/Reclaim.app/Contents/Resources
          cp assets/fonts/DejaVu-LICENSE.txt assets/fonts/FontAwesome-LICENSE.txt dist/Reclaim.app/Contents/Resources/
          codesign --force --sign - dist/Reclaim.app
          ditto -c -k --keepParent dist/Reclaim.app dist/Reclaim-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: reclaim-${{ runner.os }}
          path: |
            target/release/reclaim
            target/release/reclaim.exe
            dist/Reclaim-macOS.zip
            README.md
            LICENSE
            assets/fonts/DejaVu-LICENSE.txt
            assets/fonts/FontAwesome-LICENSE.txt
