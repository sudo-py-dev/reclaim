name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Validate version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: cargo xtask validate-tag "$RELEASE_REF"
  validate:
    needs: version
    uses: ./.github/workflows/build.yml
  build:
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
            asset: reclaim-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
            asset: reclaim-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: aarch64
            asset: reclaim-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            arch: x86_64
            asset: reclaim-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          if ! pkg-config --exists fontconfig; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libfontconfig-dev
          fi
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package portable executable and licenses
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          binary="target/$TARGET/release/reclaim"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          if [[ "$RUNNER_OS" == macOS ]]; then codesign --force --sign - "$binary"; fi
          cargo xtask bundle "$binary" dist "$ASSET"
      - name: Ensure Inno Setup is available
        if: runner.os == 'Windows'
        shell: bash
        run: choco install innosetup --yes --no-progress
      - name: Build native installer
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ASSET: ${{ matrix.asset }}
          ARCH: ${{ matrix.arch }}
        run: cargo xtask package "$PLATFORM" --binary "dist/$ASSET" --arch "$ARCH"
      - name: Checksum all downloads
        run: cargo xtask checksums dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: packaging/update-signing.pub
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install signing tool
        run: cargo install rsign2 --version =0.6.7 --locked
      - name: Sign every download with the release key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::The UPDATE_SIGNING_KEY secret is not set; refusing to publish unsigned updates."
            exit 1
          fi
          key="$RUNNER_TEMP/update-signing.key"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key")
          version="${TAG#v}"
          for file in dist/*; do
            case "$file" in *.sha256|*.minisig) continue ;; esac
            name="$(basename "$file")"
            rsign sign -W -s "$key" -t "reclaim-update file:$name version:$version" -x "$file.minisig" "$file"
            rsign verify -q -p packaging/update-signing.pub -x "$file.minisig" "$file"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "Reclaim $TAG"
          fi
      - name: Refresh website
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK is not set; skipping website rebuild."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
          echo "Website rebuild requested."
