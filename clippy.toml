disallowed-methods = [
    { path = "std::process::Command::new", reason = "Runtime functionality must use Rust implementations or native APIs, not external commands." },
    { path = "std::os::unix::process::CommandExt::exec", allow-invalid = true, reason = "Do not replace the app with an external command." },
]

# Tests report failures by panicking; the panic lints apply to shipped code only.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
