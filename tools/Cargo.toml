[package]
name = "reclaim-tools"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
crc32fast = "=1.5.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
sha2 = "=0.10.9"
# DEX fixture checksum only, never used for release or application security.
sha1 = "=0.11.0"
tempfile = "=3.27.0"
toml = "=1.2.1"
zip = { version = "=9.4.1", default-features = false, features = ["deflate-flate2"] }

[lints.rust]
unsafe_code = "forbid"
